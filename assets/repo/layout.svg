<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" role="img" aria-labelledby="title description">
  <title id="title">Miri scrolling columns and optional stacked rows</title>
  <desc id="description">The visible screen contains Window A in column 1 and stacked Windows B and C in column 2. Window D is in column 3 offscreen to the right. Moving focus right scrolls the view to reveal it.</desc>
  <rect width="600" height="350" fill="#0d1117"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" text-anchor="middle">
    <text x="198" y="38" fill="#f0f6fc">Visible screen</text>
    <text x="489" y="38" fill="#b1bac4">Offscreen</text>
    <rect x="20" y="56" width="358" height="220" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <rect x="38" y="74" width="138" height="184" fill="#1c314b" stroke="#58a6ff" stroke-width="2"/>
    <text x="107" y="171" fill="#f0f6fc">Window A</text>
    <rect x="194" y="74" width="166" height="70" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
    <text x="277" y="116" fill="#f0f6fc">Window B</text>
    <rect x="194" y="162" width="166" height="96" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
    <text x="277" y="217" fill="#f0f6fc">Window C</text>
    <rect x="414" y="74" width="150" height="184" fill="#161b22" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="489" y="171" fill="#b1bac4">Window D</text>
    <text x="107" y="302" fill="#b1bac4">Column 1</text>
    <text x="277" y="302" fill="#b1bac4">Column 2</text>
    <text x="489" y="302" fill="#b1bac4">Column 3</text>
    <text x="300" y="333" fill="#58a6ff" font-size="18">Focus right → scroll to reveal Column 3</text>
  </g>
</svg>
